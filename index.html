<style id="app-css">/* Layout: asymmetric, left-aligned editorial grid. The hero pairs the title with a 96-well microplate,
   one row per field, serial dilution left to right. Reading text in a serif, interface in a grotesque. */
:root {
  --bg: #f1f5f4;
  --surface: #ffffff;
  --surface-2: #e7eeed;
  --ink: #0d2a30;
  --ink-2: #456167;
  --line: #cddad9;
  --line-2: #9fb4b4;
  --accent: #bd1f55;
  --accent-ink: #ffffff;
  --accent-2: #1d6a8a;
  --crit: #b3261e;
  --ok: #2e8b57;
  --d-a: #2e8b57;
  --d-b: #2f6fb8;
  --d-c: #c48a12;
  --d-d: #6d45c4;
  --d-e: #7fa01a;
  --d-f: #d8612a;
  --d-g: #138e96;
  --d-h: #6b8286;
  --shadow: 0 1px 2px rgba(13, 42, 48, .06), 0 10px 28px rgba(13, 42, 48, .07);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-text: 'Newsreader', Georgia, 'Times New Roman', serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1b20; --surface: #102a31; --surface-2: #163640; --ink: #e4efee; --ink-2: #9db5b7;
    --line: #264852; --line-2: #4c7079; --accent: #ff7ba3; --accent-ink: #1a0610; --accent-2: #5cb8d6;
    --crit: #ff8f86; --ok: #4fc084;
    --d-a: #4fc084; --d-b: #6aa6ee; --d-c: #e8b23a; --d-d: #a184f0; --d-e: #a5cb3e; --d-f: #f28a58; --d-g: #3cc4cc; --d-h: #8da7ab;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1b20; --surface: #102a31; --surface-2: #163640; --ink: #e4efee; --ink-2: #9db5b7;
  --line: #264852; --line-2: #4c7079; --accent: #ff7ba3; --accent-ink: #1a0610; --accent-2: #5cb8d6;
  --crit: #ff8f86; --ok: #4fc084;
  --d-a: #4fc084; --d-b: #6aa6ee; --d-c: #e8b23a; --d-d: #a184f0; --d-e: #a5cb3e; --d-f: #f28a58; --d-g: #3cc4cc; --d-h: #8da7ab;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .28);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-text);
  font-size: 18px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--surface);
  z-index: 60;
}
a { color: var(--accent-2); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.band { padding-block: 64px; }
.band.alt { background: var(--surface); border-block: 1px solid var(--line); }
.band.tight { padding-block: 40px; }
.eyebrow {
  font-family: var(--f-mono);
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.muted { color: var(--ink-2); }
.mono { font-family: var(--f-mono); }

/* Header */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 62px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand:hover { color: var(--ink); }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em; font-variation-settings: "wdth" 88; }
.nav { display: flex; gap: 2px; margin-left: 8px; flex: 1; min-width: 0; }
.nav a {
  font-family: var(--f-display);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
  padding: 8px 11px;
  border-radius: var(--r);
  white-space: nowrap;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
.tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.ibtn {
  display: inline-grid; place-items: center;
  min-width: 38px; height: 38px; padding: 0 8px;
  background: transparent; border: 1px solid var(--line); border-radius: var(--r);
  cursor: pointer; font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--ink);
}
.ibtn:hover { border-color: var(--ink-2); background: var(--surface-2); }
.ibtn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }
.admin-link { font-family: var(--f-mono); font-size: 12px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--f-display); font-weight: 600; font-size: 15px; line-height: 1;
  padding: 13px 20px;
  border: 1px solid var(--ink); border-radius: var(--r);
  background: transparent; color: var(--ink);
  text-decoration: none; cursor: pointer;
  transition: background-color .15s, color .15s, border-color .15s, transform .15s;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); background: var(--accent); }
.btn.sm { padding: 9px 13px; font-size: 14px; }
.btn.danger { border-color: var(--crit); color: var(--crit); }
.btn.danger:hover { background: var(--crit); color: var(--bg); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.link { border: 0; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; color: var(--accent-2); }
.btn.link:hover { background: transparent; color: var(--accent); }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }

/* Hero */
.hero { padding-block: 56px 48px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 56px; align-items: center; }
.hero h1 {
  font-size: clamp(46px, 7.2vw, 92px);
  font-weight: 750;
  font-variation-settings: "wdth" 80;
  letter-spacing: -.035em;
  line-height: .96;
  margin-block: 16px 22px;
}
.hero h1 span { display: block; color: var(--accent); }
.lede { font-size: 21px; line-height: 1.5; max-width: 34em; color: var(--ink); margin-bottom: 28px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; margin: 40px 0 0; }
.facts div { border-top: 1px solid var(--line-2); padding: 12px 0 14px; }
.facts dt { font-family: var(--f-display); font-weight: 650; font-size: 16px; }
.facts dd { margin: 2px 0 0; font-size: 15px; color: var(--ink-2); line-height: 1.4; }

.plate-wrap { margin: 0; min-width: 0; }
.plate { width: 100%; height: auto; display: block; }
.plate-body { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.5; }
.plate-lbl { font-family: var(--f-mono); font-size: 11px; fill: var(--ink-2); text-anchor: middle; }
.plate .well { fill: var(--c); stroke: var(--c); stroke-width: 1.5; stroke-opacity: .55; transition: opacity .18s; }
.plate .well.blank { fill: none; stroke: var(--line-2); stroke-opacity: 1; }
.plate[data-hl] .well:not([data-row="__"]) { opacity: .2; }
.plate[data-hl="A"] .well[data-row="A"], .plate[data-hl="B"] .well[data-row="B"], .plate[data-hl="C"] .well[data-row="C"],
.plate[data-hl="D"] .well[data-row="D"], .plate[data-hl="E"] .well[data-row="E"], .plate[data-hl="F"] .well[data-row="F"],
.plate[data-hl="G"] .well[data-row="G"], .plate[data-hl="H"] .well[data-row="H"] { opacity: 1; }
.r-A { --c: var(--d-a); } .r-B { --c: var(--d-b); } .r-C { --c: var(--d-c); } .r-D { --c: var(--d-d); }
.r-E { --c: var(--d-e); } .r-F { --c: var(--d-f); } .r-G { --c: var(--d-g); } .r-H { --c: var(--d-h); }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 18px; margin-top: 16px; }
.leg {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: var(--r);
  font-family: var(--f-display); font-size: 14.5px; font-weight: 500; color: var(--ink); text-decoration: none;
}
.leg:hover { background: var(--surface-2); color: var(--ink); }
.leg i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex: none; }
.leg b { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); width: 12px; font-weight: 500; }
.plate-cap { font-size: 14px; color: var(--ink-2); margin-top: 12px; line-height: 1.45; }

/* Section heads */
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 30px; flex-wrap: wrap; }
.sec-head h2 { font-size: clamp(28px, 4vw, 42px); font-weight: 700; letter-spacing: -.025em; margin-top: 8px; max-width: 18em; }
.sec-head p { max-width: 36em; color: var(--ink-2); margin-top: 10px; }
.page-head { padding-block: 52px 28px; }
.page-head h1 { font-size: clamp(36px, 5.4vw, 64px); font-weight: 720; font-variation-settings: "wdth" 84; letter-spacing: -.03em; margin-top: 10px; }
.page-head p { max-width: 38em; font-size: 20px; color: var(--ink-2); margin-top: 14px; line-height: 1.5; }

/* Steps (a real sequence) */
.steps { list-style: none; counter-reset: s; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
.steps li { counter-increment: s; padding: 0 18px 0 0; position: relative; }
.steps li::before {
  content: counter(s);
  font-family: var(--f-mono); font-size: 13px; font-weight: 500;
  display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--ink); background: var(--surface); position: relative; z-index: 1;
}
.steps li::after { content: ""; position: absolute; top: 14px; left: 28px; right: 0; border-top: 1px solid var(--line-2); }
.steps li:last-child::after { display: none; }
.steps h3 { font-size: 17px; font-weight: 650; margin-top: 14px; }
.steps p { font-size: 15px; line-height: 1.45; color: var(--ink-2); margin-top: 6px; }

/* Cards, lists */
.grid { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; min-width: 0; }
.panel.shadow { box-shadow: var(--shadow); }
.empty {
  border: 1px dashed var(--line-2); border-radius: var(--r); padding: 32px 28px; background: var(--surface);
  display: grid; gap: 10px; justify-items: start;
}
.empty h3 { font-size: 22px; font-weight: 650; }
.empty p { color: var(--ink-2); max-width: 36em; }
.callout {
  background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 40px; display: grid; gap: 18px;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); align-items: center;
}
.callout h2 { font-size: clamp(26px, 3.6vw, 38px); font-weight: 700; letter-spacing: -.02em; }
.callout p { color: color-mix(in srgb, var(--bg) 78%, transparent); margin-top: 10px; }
.callout .btn { border-color: var(--bg); color: var(--bg); }
.callout .btn:hover { background: var(--bg); color: var(--ink); }
.callout .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.callout ul { list-style: none; display: grid; gap: 6px; font-family: var(--f-display); font-size: 15px; }
.callout li { display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid color-mix(in srgb, var(--bg) 22%, transparent); padding-bottom: 6px; }
.callout li b { font-family: var(--f-mono); font-weight: 500; font-size: 12px; min-width: 7ch; opacity: .75; }

/* Domains */
.dom { display: grid; grid-template-columns: 120px minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; padding-block: 36px; border-top: 1px solid var(--line-2); scroll-margin-top: 90px; }
.dom-row { display: flex; align-items: center; gap: 14px; }
.dom-row .dots { display: grid; grid-template-columns: repeat(4, 12px); gap: 5px; }
.dom-row .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.dom-row .dots i:nth-child(2) { opacity: .7; } .dom-row .dots i:nth-child(3) { opacity: .45; } .dom-row .dots i:nth-child(4) { opacity: .25; }
.dom-letter { font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.dom h2 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 700; letter-spacing: -.02em; }
.dom p { margin-top: 10px; color: var(--ink-2); }
.topics { list-style: none; display: grid; gap: 0; align-content: start; font-family: var(--f-display); font-size: 16px; }
.topics li { padding: 9px 0; border-bottom: 1px solid var(--line); }
.topics li:first-child { padding-top: 0; }

/* Articles */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
.art { display: grid; gap: 10px; padding-block: 26px; border-top: 1px solid var(--line-2); }
.art-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.dot { display: inline-flex; align-items: center; gap: 6px; }
.dot::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--d-h)); }
.art h3 { font-size: clamp(21px, 2.4vw, 26px); font-weight: 650; letter-spacing: -.015em; line-height: 1.2; }
.art .au { font-family: var(--f-display); font-size: 15px; color: var(--ink-2); }
.art details { margin-top: 2px; }
.art summary { cursor: pointer; font-family: var(--f-display); font-size: 14px; font-weight: 600; color: var(--accent-2); }
.art details p { margin-top: 10px; max-width: 46em; }
.art .links { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--f-display); font-size: 14px; }

/* Board */
.board-group { padding-block: 30px; border-top: 1px solid var(--line-2); display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 28px; }
.board-group h2 { font-size: 22px; font-weight: 680; letter-spacing: -.01em; }
.board-group .n { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.members { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 28px; }
.member { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 16px; align-items: start; }
.avatar {
  width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: -.02em;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.member h3 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
.member .aff { font-size: 15px; color: var(--ink-2); line-height: 1.4; margin-top: 2px; }
.member .exp { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag { font-family: var(--f-display); font-size: 12.5px; padding: 2px 8px; border: 1px solid var(--line-2); border-radius: 99px; color: var(--ink-2); }
.member .bio { font-size: 15px; margin-top: 8px; line-height: 1.45; }
.member .orcid { font-family: var(--f-mono); font-size: 12px; margin-top: 6px; display: inline-block; }

/* Prose pages */
.prose { max-width: 44em; }
.prose h2 { font-size: 26px; font-weight: 680; margin-top: 40px; margin-bottom: 10px; letter-spacing: -.015em; }
.prose h2:first-child { margin-top: 0; }
.prose p, .prose li { margin-top: 10px; }
.prose ul { padding-left: 1.2em; }
.two-col { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; align-items: start; }
.sub-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.toc { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); display: grid; gap: 2px; font-family: var(--f-display); font-size: 14px; }
.toc a { text-decoration: none; padding: 6px 10px; border-left: 2px solid var(--line); color: var(--ink-2); }
.toc a:hover { border-left-color: var(--accent); color: var(--ink); }
.tbl-wrap { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-family: var(--f-display); font-size: 14.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.acc details { border-top: 1px solid var(--line-2); padding-block: 4px; }
.acc details:last-child { border-bottom: 1px solid var(--line-2); }
.acc summary { cursor: pointer; font-family: var(--f-display); font-weight: 620; font-size: 19px; padding: 14px 0; list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after { content: "+"; font-family: var(--f-mono); font-size: 18px; color: var(--accent); }
.acc details[open] summary::after { content: "–"; }
.acc .body { padding: 0 0 18px; max-width: 46em; }
.acc .body p + p { margin-top: 10px; }

/* Forms */
.fld { display: grid; gap: 6px; min-width: 0; }
.fld label, .lbl { font-family: var(--f-display); font-size: 14px; font-weight: 600; }
.req { color: var(--accent); }
input[type=text], input[type=email], input[type=number], input[type=search], input[type=url], input[type=date], select, textarea {
  width: 100%; font-family: var(--f-display); font-size: 16px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 11px 12px; min-width: 0;
}
textarea { min-height: 112px; resize: vertical; line-height: 1.5; font-family: var(--f-text); font-size: 17px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; border-color: var(--accent-2); }
.fld.bad input, .fld.bad select, .fld.bad textarea { border-color: var(--crit); }
.err { color: var(--crit); font-family: var(--f-display); font-size: 13.5px; font-weight: 500; }
.hint { color: var(--ink-2); font-family: var(--f-display); font-size: 13.5px; line-height: 1.4; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stack { display: grid; gap: 18px; }
.chk { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; font-family: var(--f-display); font-size: 15.5px; line-height: 1.45; cursor: pointer; }

      cx = ox + R + c * pitch;
      if (c === cols - 1) { s += '<circle class="well blank r-' + rows[r] + '" data-row="' + rows[r] + '" cx="' + cx + '" cy="' + cy + '" r="' + R + '"/>'; }
      else { op = (0.96 - c * 0.078).toFixed(2); s += '<circle class="well r-' + rows[r] + '" data-row="' + rows[r] + '" cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill-opacity="' + op + '"/>'; }
    }
  }
  return s + '</svg>';
}

        '<ul><li>Upload the manuscript as a PDF at submission. The editable Word version is requested with the revision.</li><li>11-point font, 1.5 line spacing, continuous line and page numbers.</li><li>Figures at 300 dpi minimum, each with a self-contained legend. Editable tables, never as images.</li><li>SI units. Species names in italics, full name at first mention.</li><li>Microbial strains: collection or deposit number. Sequences: accession number in a public database.</li></ul>')],
    ['refs', tr('Références', 'References'),
      tr('<p>Références numérotées dans l’ordre d’apparition, au format Vancouver, avec le DOI quand il existe. Citez de préférence des sources évaluées par des pairs. Toute donnée non publiée ou communication personnelle se signale dans le texte, pas dans la liste.</p>',
        '<p>References numbered in order of appearance, Vancouver format, with the DOI when one exists. Prefer peer-reviewed sources. Unpublished data and personal communications are flagged in the text, not in the list.</p>')],
    ['avant', tr('Avant de soumettre', 'Before you submit'),
      tr('<ul><li>Le manuscrit est original et n’est pas en évaluation ailleurs.</li><li>Tous les auteurs ont lu et approuvé la version soumise.</li><li>L’approbation éthique, le consentement et les autorisations de prélèvement sont documentés.</li><li>Les données et les souches sont accessibles ou leur restriction est justifiée.</li><li>Tout recours à un outil d’intelligence artificielle générative est déclaré.</li></ul>',
        '<ul><li>The manuscript is original and not under review elsewhere.</li><li>All authors have read and approved the submitted version.</li><li>Ethics approval, consent and collection permits are documented.</li><li>Data and strains are accessible or any restriction is justified.</li><li>Any use of generative AI tools is declared.</li></ul>')],
    ['apres', tr('Après acceptation', 'After acceptance'),
      tr('<p>Les épreuves sont envoyées à l’auteur correspondant, qui dispose de quelques jours pour les corriger. L’article est ensuite publié avec son DOI. Les auteurs conservent leur droit d’auteur et le texte est diffusé sous licence CC BY 4.0.</p>',
        '<p>Proofs are sent to the corresponding author, who has a few days to correct them. The article is then published with its DOI. Authors keep their copyright and the text is released under a CC BY 4.0 licence.</p>')]
  ];
  return headHTML(esc(tr('Pour les auteurs', 'For authors')), tr('Instructions aux auteurs', 'Author guidelines'), tr('Ce qu’il faut préparer avant d’ouvrir le formulaire de soumission.', 'What to prepare before opening the submission form.')) +
    '<section class="band tight" style="padding-top:8px"><div class="wrap two-col"><nav class="toc" aria-label="' + esc(tr('Sur cette page', 'On this page')) + '">' +
    secs.map(function (s) { return '<a href="#auteurs" data-scroll="g-' + s[0] + '">' + esc(s[1]) + '</a>'; }).join('') + '</nav>' +
    '<div class="prose">' + secs.map(function (s) { return '<h2 id="g-' + s[0] + '" style="scroll-margin-top:90px">' + esc(s[1]) + '</h2>' + s[2]; }).join('') +
    '<div class="cta-row" style="margin-top:36px"><a class="btn primary" href="#soumettre">' + esc(tr('Ouvrir le formulaire de soumission', 'Open the submission form')) + '</a></div></div></div></section>';
}

function viewPolicies() {
  var P = [
    [tr('Évaluation par les pairs', 'Peer review'), tr('Chaque manuscrit passe d’abord un contrôle éditorial portant sur le périmètre, la forme et la similarité avec des textes existants. Les manuscrits retenus sont envoyés à au moins deux relecteurs indépendants, en double anonymat : les relecteurs ignorent l’identité des auteurs et les auteurs celle des relecteurs. Les décisions possibles sont l’acceptation, la révision mineure, la révision majeure et le refus. Un auteur qui conteste une décision peut écrire à l’éditeur en argumentant ; un second avis est alors demandé à un rédacteur qui n’a pas traité le manuscrit.', 'Every manuscript first goes through an editorial check of scope, format and similarity with existing texts. Retained manuscripts go to at least two independent reviewers, double-anonymous: reviewers do not know the authors and authors do not know the reviewers. Possible decisions are acceptance, minor revision, major revision and rejection. An author who disputes a decision may write to the editor with arguments; a second opinion is then requested from an editor who did not handle the manuscript.')],
    [tr('Accès libre et licence', 'Open access and licence'), tr('Tous les articles sont lisibles gratuitement dès leur publication et diffusés sous licence Creative Commons CC BY 4.0. Les auteurs conservent leur droit d’auteur. Les conditions financières, y compris les éventuelles exonérations pour les auteurs de pays à revenu faible, sont communiquées avant l’acceptation et jamais après.', 'All articles are free to read on publication and released under a Creative Commons CC BY 4.0 licence. Authors keep their copyright. Financial terms, including any waivers for authors from low-income countries, are communicated before acceptance and never after.')],
    [tr('Éthique de la recherche', 'Research ethics'), tr('Les études sur des personnes exigent l’approbation d’un comité d’éthique et un consentement éclairé. Les études sur des animaux suivent les lignes directrices ARRIVE et l’approbation d’un comité compétent. Les essais cliniques doivent être enregistrés avant l’inclusion du premier participant. Pour les ressources génétiques et les souches prélevées dans un pays, les auteurs indiquent les autorisations obtenues, y compris au titre du Protocole de Nagoya. Les travaux à risque biologique précisent le niveau de biosécurité utilisé.', 'Studies on people require ethics committee approval and informed consent. Animal studies follow the ARRIVE guidelines and approval by a competent committee. Clinical trials must be registered before the first participant is enrolled. For genetic resources and strains collected in a country, authors state the permits obtained, including under the Nagoya Protocol. Work with biological risk states the biosafety level used.')],
    [tr('Intégrité, plagiat et images', 'Integrity, plagiarism and images'), tr('Les manuscrits sont contrôlés avec un logiciel de similarité avant l’évaluation. La revue refuse le plagiat, y compris le plagiat de ses propres textes, la fabrication ou la falsification de données et la manipulation d’images. Des images originales (gels, immunoempreintes, microscopie) peuvent être demandées. Les manuscrits issus d’officines de rédaction sont refusés.', 'Manuscripts are screened with similarity software before review. The journal rejects plagiarism, including self-plagiarism, fabrication or falsification of data, and image manipulation. Original images (gels, blots, microscopy) may be requested. Manuscripts from paper mills are rejected.')],
    [tr('Auteurs et contributions', 'Authorship and contributions'), tr('Est auteur toute personne qui a contribué de façon substantielle à la conception, aux données ou à leur analyse, a participé à la rédaction et approuve la version finale. Les contributions sont décrites selon la taxonomie CRediT. Tout ajout, retrait ou changement d’ordre des auteurs après la soumission exige l’accord écrit de tous les auteurs concernés.', 'An author is anyone who made a substantial contribution to the design, the data or their analysis, took part in drafting and approves the final version. Contributions are described with the CRediT taxonomy. Any addition, removal or reordering of authors after submission requires written agreement from all authors involved.')],
    [tr('Conflits d’intérêts', 'Conflicts of interest'), tr('Auteurs, relecteurs et rédacteurs déclarent tout lien financier ou personnel susceptible d’influencer le travail ou son évaluation. Un rédacteur ne traite pas un manuscrit de son entourage proche ni de sa propre institution. Les auteurs peuvent proposer jusqu’à trois relecteurs et en exclure ; l’éditeur n’est pas tenu de suivre ces suggestions.', 'Authors, reviewers and editors declare any financial or personal tie that could influence the work or its evaluation. An editor does not handle a manuscript from a close associate or their own institution. Authors may suggest up to three reviewers and exclude some; the editor is not bound by these suggestions.')],
    [tr('Données et matériel', 'Data and materials'), tr('Chaque article comporte une déclaration de disponibilité des données. Les séquences sont déposées dans une base publique avant la publication et les souches dans une collection reconnue quand c’est possible. Si les données ne peuvent pas être partagées, la raison est exposée.', 'Each article carries a data availability statement. Sequences are deposited in a public database before publication and strains in a recognised collection when possible. If data cannot be shared, the reason is stated.')],
    [tr('Intelligence artificielle', 'Artificial intelligence'), tr('Un outil d’IA ne peut pas être auteur. Les auteurs déclarent tout usage d’un outil génératif dans la rédaction, l’analyse ou la production d’images, et restent responsables du contenu. Les relecteurs et rédacteurs ne déposent pas de manuscrits confidentiels dans des outils d’IA accessibles au public.', 'An AI tool cannot be an author. Authors declare any use of a generative tool in writing, analysis or image production, and remain responsible for the content. Reviewers and editors do not upload confidential manuscripts to publicly accessible AI tools.')],
    [tr('Corrections et rétractations', 'Corrections and retractions'), tr('Une erreur qui modifie l’interprétation d’un article donne lieu à un erratum. Un article dont les conclusions sont invalidées par une faute ou une inconduite est rétracté ; la notice reste liée à l’article, qui demeure consultable avec la mention de rétractation. La revue s’appuie sur les recommandations du Committee on Publication Ethics (COPE) pour instruire les plaintes.', 'An error that changes the interpretation of an article leads to a correction. An article whose conclusions are invalidated by error or misconduct is retracted; the notice stays linked to the article, which remains accessible with a retraction mark. The journal relies on the Committee on Publication Ethics (COPE) recommendations to investigate complaints.')],
    [tr('Confidentialité et archivage', 'Confidentiality and archiving'), tr('Les manuscrits soumis sont confidentiels jusqu’à leur publication. Les données personnelles des auteurs et des relecteurs servent uniquement à la gestion éditoriale. Les articles publiés sont conservés dans au moins une archive numérique pérenne.', 'Submitted manuscripts are confidential until publication. Personal data of authors and reviewers is used solely for editorial management. Published articles are preserved in at least one long-term digital archive.')]
  ];
  return headHTML(esc(tr('Règles de la revue', 'Journal rules')), tr('Politiques éditoriales', 'Editorial policies'), tr('Ces règles s’appliquent aux auteurs, aux relecteurs et aux rédacteurs.', 'These rules apply to authors, reviewers and editors.')) +
    '<section class="band tight" style="padding-top:8px"><div class="wrap"><div class="acc">' +
    P.map(function (p, i) { return '<details' + (i === 0 ? ' open' : '') + '><summary>' + esc(p[0]) + '</summary><div class="body"><p>' + esc(p[1]) + '</p></div></details>'; }).join('') + '</div></div></section>';
}

function viewContact() {

    '<section class="band tight" style="padding-top:8px"><div class="wrap"><div class="grid g3">' +

    '<div class="panel"><h3 style="font-size:19px;font-weight:650;margin-bottom:12px">' + esc(tr('Publication', 'Publisher')) + '</h3><p>' + esc(s.publisher || tr('Éditeur à préciser', 'Publisher to be announced')) + '</p>' + (s.address ? '<p class="muted" style="margin-top:8px">' + esc(s.address).replace(/\n/g, '<br>') + '</p>' : '') + '<p class="mono muted" style="margin-top:12px;font-size:12.5px">' + issnText() + '</p></div>' +
    '<div class="panel"><h3 style="font-size:19px;font-weight:650;margin-bottom:12px">' + esc(tr('Numéros spéciaux', 'Special issues')) + '</h3><p class="muted">' + esc(tr('Une thématique, une liste de contributeurs pressentis et un calendrier suffisent pour ouvrir la discussion. Indiquez ces éléments dans votre message.', 'A theme, a list of prospective contributors and a timeline are enough to start the discussion. Include them in your message.')) + '</p></div>' +
    '</div></div></section>';
}

/* ---------- submission form ---------- */
function blankForm() {
  return {
    type: 'research', area: 'C', title: '', abstract: '', keywords: '', mlang: 'en', words: '',
    authors: [{ name: '', aff: '', country: '', email: '', orcid: '', corr: true }], credit: '',
    cover: '', suggest: '', exclude: '', funding: '', coi: '',
    ethics: 'na', ethicsText: '', data: 'text', dataText: '', ai: 'none', aiText: '',
    d1: false, d2: false, d3: false, d4: false, files: [], supp: []
  };
}
var F = blankForm();
try { var dr = lsGet('mb-draft'); if (dr) F = Object.assign(blankForm(), JSON.parse(dr)); } catch (e) { F = blankForm(); }
var step = 0, errs = {}, done = null, busy = false;
var saveTimer = null;
function saveDraft() { clearTimeout(saveTimer); saveTimer = setTimeout(function () { lsSet('mb-draft', JSON.stringify(F)); }, 400); }

function opts(list, sel) { return list.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(sel) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join(''); }
function fld(id, label, inner, o) {
  o = o || {};
  return '<div class="fld' + (o.err ? ' bad' : '') + '"><label for="' + id + '">' + label + (o.req ? '<span class="req" aria-hidden="true"> *</span>' : '') + '</label>' + inner +
    (o.hint ? '<p class="hint">' + o.hint + '</p>' : '') + (o.err ? '<p class="err" role="alert">' + esc(o.err) + '</p>' : '') + '</div>';
}
function tin(name, o) {
  o = o || {};
  return '<input type="' + (o.type || 'text') + '" id="f-' + name + '" data-f="' + name + '" value="' + esc(F[name]) + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (errs[name] ? ' aria-invalid="true"' : '') + '>';
}
function tarea(name, rows, ph) { return '<textarea id="f-' + name + '" data-f="' + name + '" rows="' + (rows || 4) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + (errs[name] ? ' aria-invalid="true"' : '') + '>' + esc(F[name]) + '</textarea>'; }
function chk(name, label) { return '<label class="chk' + (errs[name] ? ' bad' : '') + '"><input type="checkbox" id="f-' + name + '" data-f="' + name + '"' + (F[name] ? ' checked' : '') + '><span>' + label + (errs[name] ? '<br><span class="err">' + esc(errs[name]) + '</span>' : '') + '</span></label>'; }

function step0() {
  var t = typeOf(F.type), wc = words(F.abstract);
  return '<div class="stack">' +
    '<div class="row2">' + fld('f-type', tr('Type d’article', 'Article type'), '<select id="f-type" data-f="type">' + opts(TYPES.map(function (x) { return [x[0], lang === 'fr' ? x[1] : x[2]]; }), F.type) + '</select>', { req: 1, hint: esc(tr('Maximum ' + t[3] + ' mots de texte principal, résumé de ' + t[4] + ' mots au plus.', 'Up to ' + t[3] + ' main-text words, abstract of ' + t[4] + ' words at most.')) }) +
    fld('f-area', tr('Domaine principal', 'Main field'), '<select id="f-area" data-f="area">' + opts(DOMAINS.map(function (d) { return [d.k, d.k + ' · ' + d[lang][0]]; }), F.area) + '</select>', { req: 1 }) + '</div>' +
    fld('f-title', tr('Titre', 'Title'), tin('title'), { req: 1, err: errs.title }) +
    fld('f-abstract', tr('Résumé', 'Abstract'), tarea('abstract', 8) + '<div class="count' + (wc > t[4] ? ' over' : '') + '" id="abs-count">' + wc + ' / ' + t[4] + ' ' + esc(tr('mots', 'words')) + '</div>', { req: 1, err: errs.abstract }) +
    fld('f-keywords', tr('Mots-clés', 'Keywords'), tin('keywords'), { req: 1, err: errs.keywords, hint: esc(tr('Entre 3 et 8 mots-clés, séparés par des virgules.', 'Between 3 and 8 keywords, separated by commas.')) }) +
    '<div class="row2">' + fld('f-mlang', tr('Langue du manuscrit', 'Manuscript language'), '<select id="f-mlang" data-f="mlang">' + opts([['en', 'English'], ['fr', 'Français']], F.mlang) + '</select>', { req: 1 }) +
    fld('f-words', tr('Nombre de mots du texte principal', 'Main-text word count'), tin('words', { type: 'number' }), { err: errs.words, hint: esc(tr('Facultatif.', 'Optional.')) }) + '</div></div>';
}
function authorBlock(a, i) {
  var e = errs['a' + i] || {};
  var id = function (n) { return 'a' + i + '-' + n; };
  function ain(n, type) { return '<input type="' + (type || 'text') + '" id="' + id(n) + '" data-a="' + i + '.' + n + '" value="' + esc(a[n]) + '"' + (e[n] ? ' aria-invalid="true"' : '') + '>'; }
  return '<div class="author"><div class="author-head"><b style="font-family:var(--f-display)">' + esc(tr('Auteur ', 'Author ')) + (i + 1) + '</b><div class="rowact">' +
    '<label class="chk" style="grid-template-columns:20px auto;font-size:14px"><input type="radio" name="corr" id="' + id('corr') + '" data-act="corr" data-i="' + i + '"' + (a.corr ? ' checked' : '') + '><span>' + esc(tr('Auteur correspondant', 'Corresponding author')) + '</span></label>' +
    (F.authors.length > 1 ? '<button type="button" class="btn sm danger" data-act="delAuthor" data-i="' + i + '">' + esc(tr('Retirer', 'Remove')) + '</button>' : '') + '</div></div>' +
    '<div class="row2">' + fld(id('name'), tr('Nom complet', 'Full name'), ain('name'), { req: 1, err: e.name }) + fld(id('email'), 'E-mail', ain('email', 'email'), { req: a.corr ? 1 : 0, err: e.email }) + '</div>' +
    '<div class="row2">' + fld(id('aff'), tr('Affiliation', 'Affiliation'), ain('aff'), { req: 1, err: e.aff }) + fld(id('country'), tr('Pays', 'Country'), ain('country')) + '</div>' +
    fld(id('orcid'), 'ORCID', ain('orcid'), { err: e.orcid, hint: esc(tr('Format 0000-0000-0000-0000. Facultatif.', 'Format 0000-0000-0000-0000. Optional.')) }) + '</div>';
}
function step1() {
  return '<div class="stack"><div class="authors">' + F.authors.map(authorBlock).join('') + '</div>' +
    (errs.authors ? '<p class="err" role="alert">' + esc(errs.authors) + '</p>' : '') +
    '<div><button type="button" class="btn sm" data-act="addAuthor">' + esc(tr('Ajouter un auteur', 'Add an author')) + '</button></div>' +
    fld('f-credit', tr('Contributions des auteurs', 'Author contributions'), tarea('credit', 4, tr('Exemple : A.B. conceptualisation, méthodologie ; C.D. analyse, rédaction.', 'Example: A.B. conceptualisation, methodology; C.D. analysis, writing.')), { hint: esc(tr('Taxonomie CRediT. Facultatif à la soumission, obligatoire à l’acceptation.', 'CRediT taxonomy. Optional at submission, required at acceptance.')) }) + '</div>';
}
function step2() {
  return '<div class="stack">' +
    fld('f-cover', tr('Lettre de présentation', 'Cover letter'), tarea('cover', 6), { req: 1, err: errs.cover, hint: esc(tr('Intérêt de l’article pour les lecteurs de la revue, nouveauté, lien avec le périmètre.', 'Why the article matters to the journal’s readers, what is new, how it fits the scope.')) }) +
    '<div class="row2">' + fld('f-suggest', tr('Relecteurs proposés', 'Suggested reviewers'), tarea('suggest', 4, tr('Un par ligne : nom, institution, e-mail (3 maximum)', 'One per line: name, institution, email (3 maximum)')), {}) +
    fld('f-exclude', tr('Relecteurs à exclure', 'Reviewers to exclude'), tarea('exclude', 4, tr('Un par ligne, avec le motif', 'One per line, with the reason')), {}) + '</div>' +
    fld('f-funding', tr('Financement', 'Funding'), tarea('funding', 3, tr('Organismes, numéros de subvention, ou « Aucun financement spécifique ».', 'Funders, grant numbers, or “No specific funding”.')), {}) +
    fld('f-coi', tr('Conflits d’intérêts', 'Conflicts of interest'), tarea('coi', 3, tr('Décrivez-les, ou écrivez « Aucun conflit d’intérêts ».', 'Describe them, or write “No conflicts of interest”.')), { req: 1, err: errs.coi }) +
    '<div class="row2">' + fld('f-ethics', tr('Éthique', 'Ethics'), '<select id="f-ethics" data-f="ethics">' + opts([['na', tr('Sans objet (pas d’humains, d’animaux ni de prélèvements réglementés)', 'Not applicable (no humans, animals or regulated sampling)')], ['human', tr('Étude sur des personnes, approbation obtenue', 'Human study, approval obtained')], ['animal', tr('Étude sur des animaux, approbation obtenue', 'Animal study, approval obtained')], ['permit', tr('Ressources biologiques avec autorisation de prélèvement', 'Biological resources with collection permit')]], F.ethics) + '</select>', { req: 1 }) +
    fld('f-ethicsText', tr('Référence d’approbation', 'Approval reference'), tin('ethicsText'), { err: errs.ethicsText, hint: esc(tr('Comité, numéro et date. Obligatoire sauf « sans objet ».', 'Committee, number and date. Required unless “not applicable”.')) }) + '</div>' +
    '<div class="row2">' + fld('f-data', tr('Disponibilité des données', 'Data availability'), '<select id="f-data" data-f="data">' + opts([['text', tr('Dans l’article et ses annexes', 'In the article and its supplements')], ['repo', tr('Déposées dans un dépôt public', 'Deposited in a public repository')], ['request', tr('Sur demande raisonnable', 'On reasonable request')], ['none', tr('Non disponibles (motif à préciser)', 'Not available (reason required)')]], F.data) + '</select>', { req: 1 }) +
    fld('f-dataText', tr('Précisions', 'Details'), tin('dataText'), { err: errs.dataText, hint: esc(tr('Lien ou numéro d’accès du dépôt, ou motif de la restriction.', 'Repository link or accession, or reason for the restriction.')) }) + '</div>' +
    '<div class="row2">' + fld('f-ai', tr('Outils d’IA générative', 'Generative AI tools'), '<select id="f-ai" data-f="ai">' + opts([['none', tr('Aucun outil utilisé', 'No tool used')], ['used', tr('Outil utilisé (à décrire)', 'Tool used (describe)')]], F.ai) + '</select>', { req: 1 }) +
    fld('f-aiText', tr('Description de l’usage', 'Description of use'), tin('aiText'), { err: errs.aiText }) + '</div>' +
    '<div class="stack" style="gap:12px;padding-top:6px">' +
    chk('d1', esc(tr('Le manuscrit est original et n’est pas en cours d’évaluation dans une autre revue.', 'The manuscript is original and not under review in another journal.'))) +
    chk('d2', esc(tr('Tous les auteurs ont lu et approuvé la version soumise.', 'All authors have read and approved the submitted version.'))) +
    chk('d3', esc(tr('Les exigences éthiques et réglementaires ont été respectées.', 'Ethical and regulatory requirements have been met.'))) +
    chk('d4', esc(tr('J’accepte la publication sous licence CC BY 4.0 en cas d’acceptation.', 'I agree to publication under a CC BY 4.0 licence if accepted.'))) + '</div></div>';
}
function fileLi(f, kind, i) {
  return '<li><span>' + esc(f.name) + ' <span class="muted">· ' + (f.size ? (f.size / 1048576).toFixed(1) + ' Mo' : '') + '</span></span><button type="button" class="btn link" data-act="rmFile" data-kind="' + kind + '" data-i="' + i + '">' + esc(tr('Retirer', 'Remove')) + '</button></li>';
}
function step3() {
  var canUp = !!cap.assets && !!cap.db && !!cap.uid, t = typeOf(F.type);
  var au = F.authors.map(function (a) { return a.name + (a.corr ? ' *' : ''); }).join(', ');
  var files = canUp ?
    '<div class="filebox"><div><b class="lbl">' + esc(tr('Manuscrit (PDF)', 'Manuscript (PDF)')) + '</b><span class="req"> *</span><p class="hint">' + esc(tr('PDF de 20 Mo au plus, sans nom d’auteur dans le texte ni dans les propriétés du fichier (évaluation en double anonymat).', 'PDF up to 20 MB, with no author names in the text or file properties (double-anonymous review).')) + '</p></div>' +

  setTimeout(function () { if (el.isConnected) { el.removeAttribute('data-armed'); el.textContent = el.getAttribute('data-orig'); } }, 4000);
  return false;
}
function saveMember() {
  var d = adm.edit.data;
  if (!d.name.trim() || !d.aff.trim()) { adm.edit.err = tr('Nom et institution sont requis.', 'Name and institution are required.'); renderView(); return; }
  if (d.orcid.trim() && !/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/.test(d.orcid.trim())) { adm.edit.err = tr('Format ORCID invalide.', 'Invalid ORCID format.'); renderView(); return; }
  var m = Object.assign({}, d, { name: d.name.trim(), aff: d.aff.trim(), orcid: d.orcid.trim() });
  var i = -1; DATA.board.forEach(function (x, k) { if (x.id === m.id) i = k; });
  if (i >= 0) DATA.board[i] = m; else DATA.board.push(m);
  adm.edit = null; markDirty(); renderView(); toast(tr('Membre enregistré. Pensez à publier.', 'Member saved. Remember to publish.'));
}
function saveArticle() {
  var d = adm.edit.data;
  if (!d.title.trim() || !d.authors.trim()) { adm.edit.err = tr('Titre et auteurs sont requis.', 'Title and authors are required.'); renderView(); return; }
  if (d.link.trim() && !/^https?:\/\//i.test(d.link.trim())) { adm.edit.err = tr('Le lien doit commencer par https://', 'The link must start with https://'); renderView(); return; }
  var a = Object.assign({}, d, { title: d.title.trim(), authors: d.authors.trim(), doi: d.doi.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i, ''), link: d.link.trim() });
  var i = -1; DATA.articles.forEach(function (x, k) { if (x.id === a.id) i = k; });
  if (i >= 0) DATA.articles[i] = a; else DATA.articles.push(a);
  adm.edit = null; markDirty(); renderView(); toast(tr('Article enregistré. Pensez à publier.', 'Article saved. Remember to publish.'));
}
function saveSettings(form) {
  var fd = new FormData(form), em = String(fd.get('email') || '').trim();
  if (em && !/^\S+@\S+\.\S+$/.test(em)) { toast(tr('Adresse e-mail invalide.', 'Invalid email address.')); return; }
  DATA.settings = { email: em, issn: String(fd.get('issn') || '').trim(), publisher: String(fd.get('publisher') || '').trim(), issue: String(fd.get('issue') || '').trim(), address: String(fd.get('address') || '').trim(), open: !!fd.get('open') };
  markDirty(); toast(tr('Paramètres enregistrés. Pensez à publier.', 'Settings saved. Remember to publish.'));
}
async function saveStatus(ref) {
  var sel = $('#st-sel'), note = $('#st-note');
  if (!sel || !cap.db) return;
  var now = new Date().toISOString();
  try {
    await cap.db.doc('status/' + ref).set({ ref: ref, status: sel.value, updatedAt: now });
    await cap.db.doc('notes/' + ref).set({ ref: ref, text: note.value, updatedAt: now });
    toast(tr('Statut enregistré', 'Status saved'));
  } catch (er) { toast(tr('Enregistrement impossible', 'Could not save') + (er && er.code ? ' (' + er.code + ')' : '')); }
}

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target;
  var cp = t.closest && t.closest('[data-copy]');
  if (cp) { copyText(cp.getAttribute('data-copy')); return; }
  var sc = t.closest && t.closest('[data-scroll]');
  if (sc) { e.preventDefault(); var el0 = document.getElementById(sc.getAttribute('data-scroll')); if (el0) el0.scrollIntoView({ block: 'start' }); return; }
  var dm = t.closest && t.closest('[data-dom]');
  if (dm) { pending = 'dom-' + dm.getAttribute('data-dom'); if (route === 'domaines') { e.preventDefault(); renderView(); } return; }
  var ar = t.closest && t.closest('[data-area]');
  if (ar) { F.area = ar.getAttribute('data-area'); step = 0; done = null; saveDraft(); return; }
  var well = t.closest && t.closest('.well[data-row]');
  if (well) { pending = 'dom-' + well.getAttribute('data-row'); if (location.hash === '#domaines') { renderView(); } else { location.hash = 'domaines'; } return; }
  var a = t.closest && t.closest('[data-act]');
  if (!a) return;
  var act = a.getAttribute('data-act'), i = parseInt(a.getAttribute('data-i'), 10);
  if (act === 'closeOv') { if (a.id === 'ovbg' && t !== a) return; $('#ov').innerHTML = ''; return; }
  if (act === 'lang') { lang = lang === 'fr' ? 'en' : 'fr'; lsSet('mb-lang', lang); document.documentElement.setAttribute('lang', lang); renderAll(); return; }
  if (act === 'theme') {
    var cur = document.documentElement.getAttribute('data-theme');
    if (!cur) cur = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    var nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx); lsSet('mb-theme', nx); return;
  }
  if (act === 'menu') { var top = $('#top'); var o = top.classList.toggle('open'); a.setAttribute('aria-expanded', o ? 'true' : 'false'); return; }
  if (act === 'step') {
    var to = parseInt(a.getAttribute('data-to'), 10);
    if (to > step) { var er = validate(step); if (Object.keys(er).length) { errs = er; renderView(); firstBad(); return; } }
    errs = {}; step = to; renderView(); window.scrollTo(0, 0); return;
  }
  if (act === 'addAuthor') { F.authors.push({ name: '', aff: '', country: '', email: '', orcid: '', corr: false }); saveDraft(); renderView(); return; }
  if (act === 'delAuthor') { var wasC = F.authors[i].corr; F.authors.splice(i, 1); if (wasC && F.authors.length) F.authors[0].corr = true; saveDraft(); renderView(); return; }
  if (act === 'corr') { F.authors.forEach(function (x, k) { x.corr = k === i; }); saveDraft(); return; }
  if (act === 'rmFile') { var kind = a.getAttribute('data-kind'); F[kind].splice(i, 1); saveDraft(); renderView(); return; }
  if (act === 'resetForm') { if (!armed(a, tr('Confirmer l’effacement', 'Confirm clearing'))) return; F = blankForm(); step = 0; errs = {}; lsSet('mb-draft', ''); renderView(); return; }
  if (act === 'newSub') { done = null; step = 0; errs = {}; renderView(); window.scrollTo(0, 0); return; }
  if (act === 'copyPkg') { copyText(packageText(done.rec), tr('Dossier copié', 'File copied')); return; }
  if (act === 'dlPkg') { saveFile('matrix-bioscience-' + done.rec.ref + '.txt', packageText(done.rec)); return; }
  if (act === 'filter') { adm.filter = a.getAttribute('data-v'); var b = $('#adm-body'); if (b) b.innerHTML = subsHTML(); return; }
  if (act === 'openSub') {
    var ref = a.getAttribute('data-ref'), rec = null; adm.subs.forEach(function (r) { if (r.ref === ref) rec = r; });
    if (rec) { $('#ov').innerHTML = openSubHTML(rec); var f = $('#st-sel'); if (f) f.focus(); } return;
  }
  if (act === 'saveStatus') { saveStatus(a.getAttribute('data-ref')); return; }
  if (act === 'tab') { adm.tab = a.getAttribute('data-v'); adm.edit = null; renderView(); return; }
  if (act === 'exportCsv') { exportCsv(); return; }
  if (act === 'mNew') { adm.edit = { kind: 'member', id: 'new', data: newMember(), err: '' }; renderView(); return; }
  if (act === 'mEdit') { adm.edit = { kind: 'member', id: DATA.board[i].id, data: Object.assign(newMember(), DATA.board[i]), err: '' }; renderView(); var n1 = $('#e-name'); if (n1) n1.focus(); return; }
  if (act === 'mDel') { if (!armed(a, tr('Confirmer', 'Confirm'))) return; DATA.board.splice(i, 1); markDirty(); renderView(); return; }
  if (act === 'mUp' && i > 0) { var t1 = DATA.board[i]; DATA.board[i] = DATA.board[i - 1]; DATA.board[i - 1] = t1; markDirty(); renderView(); return; }
  if (act === 'mDown' && i < DATA.board.length - 1) { var t2 = DATA.board[i]; DATA.board[i] = DATA.board[i + 1]; DATA.board[i + 1] = t2; markDirty(); renderView(); return; }
  if (act === 'aNew') { adm.edit = { kind: 'article', id: 'new', data: newArticle(), err: '' }; renderView(); return; }
  if (act === 'aEdit') { adm.edit = { kind: 'article', id: DATA.articles[i].id, data: Object.assign(newArticle(), DATA.articles[i]), err: '' }; renderView(); var n2 = $('#e-title'); if (n2) n2.focus(); return; }
  if (act === 'aDel') { if (!armed(a, tr('Confirmer', 'Confirm'))) return; DATA.articles.splice(i, 1); markDirty(); renderView(); return; }
  if (act === 'cancelEdit') { adm.edit = null; renderView(); return; }
  if (act === 'rmPhoto') { adm.edit.data.photo = ''; renderView(); return; }
  if (act === 'rmPdf') { adm.edit.data.pdf = ''; renderView(); return; }
  if (act === 'publish') { publishSite(); return; }
  if (act === 'copyJson') { copyText(JSON.stringify(DATA, null, 2), tr('JSON copié', 'JSON copied')); return; }
  if (act === 'dlJson') { saveFile('matrix-bioscience-contenu.json', JSON.stringify(DATA, null, 2)); return; }
});

function onField(e) {
  var t = e.target, v;
  if (!t || !t.getAttribute) return;
  var f = t.getAttribute('data-f');
  if (f) {
    v = t.type === 'checkbox' ? t.checked : t.value; F[f] = v;
    if (errs[f]) { delete errs[f]; var fl = t.closest('.fld'); if (fl) { fl.classList.remove('bad'); var er = $('.err', fl); if (er) er.parentNode.removeChild(er); } }
    if (f === 'abstract') { var c = $('#abs-count'), tt = typeOf(F.type), wc = words(v); if (c) { c.textContent = wc + ' / ' + tt[4] + ' ' + tr('mots', 'words'); c.classList.toggle('over', wc > tt[4]); } }
    if (f === 'type' && e.type === 'change') renderView();
    saveDraft(); return;
  }
  var au = t.getAttribute('data-a');
  if (au) { var p = au.split('.'); F.authors[+p[0]][p[1]] = t.value; if (errs['a' + p[0]] && errs['a' + p[0]][p[1]]) { delete errs['a' + p[0]][p[1]]; var fl2 = t.closest('.fld'); if (fl2) fl2.classList.remove('bad'); } saveDraft(); return; }
  var ed = t.getAttribute('data-e');
  if (ed && adm.edit) { adm.edit.data[ed] = t.value; return; }
  var fa = t.getAttribute('data-fa');
  if (fa) { fArt[fa] = t.value; var l = $('#art-list'); if (l) l.innerHTML = articleList(); return; }
  if (t.id === 'adm-q') { adm.q = t.value; var b = $('#adm-body'); if (b) b.innerHTML = subsHTML(); }
}
document.addEventListener('input', onField);
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t && t.getAttribute) {
    if (t.getAttribute('data-up')) { uploadFile(t); return; }
    if (t.getAttribute('data-eup')) { eupload(t); return; }
  }
  if (t && t.tagName === 'SELECT') onField(e);
});
async function eupload(input) {
  var k = input.getAttribute('data-eup'), file = input.files && input.files[0];
  if (!file || !cap.assets || !adm.edit) return;
  if (file.size > 20 * 1048576) { toast(tr('Fichier trop volumineux (20 Mo maximum).', 'File too large (20 MB maximum).')); return; }
  try {
    toast(tr('Téléversement…', 'Uploading…'));
    var res = await cap.assets.upload(file, file.type ? { type: file.type } : undefined);
    adm.edit.data[k] = res.id; renderView();
  } catch (er) { toast(tr('Téléversement impossible', 'Upload failed') + (er && er.code ? ' (' + er.code + ')' : '')); }
}
document.addEventListener('submit', function (e) {
  var f = e.target; if (!f || !f.getAttribute) return;
  var kind = f.getAttribute('data-form'); if (!kind) return;
  e.preventDefault();
  if (kind === 'submit') doSubmit();
  else if (kind === 'member') saveMember();
  else if (kind === 'article') saveArticle();
  else if (kind === 'settings') saveSettings(f);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { var ov = $('#ov'); if (ov && ov.innerHTML) ov.innerHTML = ''; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('tr.click')) { e.preventDefault(); e.target.click(); }
});
function hl(e, on) {
  var t = e.target, el = t.closest && (t.closest('.leg[data-dom]') || t.closest('.well[data-row]'));
  var p = $('#plate'); if (!el || !p) return;
  if (on) p.setAttribute('data-hl', el.getAttribute('data-dom') || el.getAttribute('data-row')); else p.removeAttribute('data-hl');
}
document.addEventListener('mouseover', function (e) { hl(e, true); });
document.addEventListener('mouseout', function (e) { hl(e, false); });
document.addEventListener('focusin', function (e) { hl(e, true); });
document.addEventListener('focusout', function (e) { hl(e, false); });
window.addEventListener('hashchange', setRoute);

/* ---------- init ---------- */
async function use(n) { try { if (window.claude && typeof window.claude.use === 'function') return await window.claude.use(n); } catch (e) { /* unavailable */ } return null; }
async function init() {
  document.documentElement.setAttribute('lang', lang);
  setRoute();
  var r = await Promise.all([use('user'), use('db'), use('assets'), use('downloads'), use('artifact')]);
  try { if (r[0]) { cap.admin = !!(await r[0].canEdit()); cap.uid = await r[0].id(); } } catch (e) { /* ignore */ }
  cap.db = r[1]; cap.assets = r[2]; cap.dl = r[3]; cap.art = r[4]; cap.ready = true;
  var keep = route === 'soumettre' && (F.title || F.abstract);
  if (!keep || true) { var y = window.scrollY; renderAll(); window.scrollTo(0, y); }
  if (route === 'suivi') loadTrack();
}
init();
})();
/*MB-END*/
</script>
